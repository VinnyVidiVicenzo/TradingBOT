#-----------------------------------------------------------------------------
# Benchmark 0 -- hold the starting portfolio and do nothing.
#
# The floor. No orders, no fees, no spread. Any strategy that cannot beat this
# out of sample is paying for activity that did not help.
#
# The symbols below are CANDIDATES, present only so the assets can be priced.
# Nothing here is a finalized portfolio decision.
#
# This run cannot place an order. See docs/trading-bot/SAFETY.md.
#-----------------------------------------------------------------------------

[experiment]
name = "benchmark0-hold"
description = """
Mark a starting portfolio to market over the window and place no orders. Run
this first, and quote every other result relative to it.
"""
seed = 0

[data]
symbols = ["BTCUSD", "ETHUSD", "SOLUSD"]     # CANDIDATES, not finalized
interval = "1d"
# Binance.US suspended USD trading between 2023-07-14 and 2025-02-19, so the
# USD-quoted pairs have NO history across that window. This range sits entirely
# after the resumption. Run `data gaps` before trusting any window.
start = "2025-03-01T00:00:00Z"
end = "2026-09-01T00:00:00Z"
db_path = "data/market.sqlite"
# Refuse the run if history has a hole wider than this many bars. Crypto trades
# continuously, so any hole means the market was not there.
max_gap_intervals = 3
# Modelled delay between the venue closing a bar and this strategy being able to
# act on it. 0 = act at the close.
feed_delay_ms = 0

[portfolio]
valuation_asset = "USD"

# Cash held and deliberately not deployed. Benchmark 0 leaves it alone, which
# is exactly what makes it the right comparison for Benchmark 1.
initial_cash = { USD = "200.00" }

# To benchmark an actual existing portfolio, put the real positions here. A
# holding is never spendable cash.
# [[portfolio.starting_holdings]]
# asset = "BTC"
# quantity = "0.0021"

[strategy]
name = "benchmark0_hold"

[costs.fees]
# Unused -- Benchmark 0 places no orders -- but recorded so that the run
# record is directly comparable with the runs that do.
maker_rate = "0.0040"
taker_rate = "0.0060"
source = "ASSUMPTION -- placeholder, not a quoted Binance.US rate"

[fill]
model = "full"
