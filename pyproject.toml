[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-research"
version = "0.1.0"
description = "Binance.US research + backtesting platform for crypto accumulation strategies. Research only: no live execution."
requires-python = ">=3.11"
dependencies = []          # standard library only

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
crypto-research = "crypto_research.cli:main"
crypto-research-account = "account_tools.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_research*", "account_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
